# /etc/nginx/sites-available/brankas
# Ganti vault.domainanda.com dengan domain kamu, lalu jalankan certbot (lihat README).

server {
    listen 80;
    listen [::]:80;
    server_name vault.domainanda.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.domainanda.com;

    # diisi otomatis oleh certbot
    ssl_certificate     /etc/letsencrypt/live/vault.domainanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.domainanda.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;   # lampiran maks. 25 MB (ATTACH_MAX_MB)
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
